<header class="fixed inset-x-0 top-0 z-40 border-b border-ink-800/80 bg-ink-950/85 backdrop-blur-md">
  <div class="flex flex-wrap items-center gap-x-4 px-4 py-3 sm:h-16 sm:flex-nowrap sm:py-0 md:px-6">
    <a routerLink="/collections" class="group flex shrink-0 items-center gap-2.5" aria-label="Folio home">
      <span class="grid size-9 place-items-center rounded-lg bg-amber-400 shadow-glow transition-transform duration-300 group-hover:-rotate-6">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="#0B0F1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h8l4 4v14H6z" fill="#0B0F1A" stroke="none"/>
          <path d="M14 3v4h4" stroke="#FFB224"/>
          <path d="M9 12h6M9 16h4" stroke="#FFB224" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="leading-none">
        <span class="font-display text-xl font-semibold tracking-tight text-paper-50">Folio<span class="text-amber-400">.</span></span>
        <span class="label-mono mt-0.5 hidden lg:block">local document studio</span>
      </span>
    </a>

    <app-typeahead class="order-last mt-3 w-full sm:order-none sm:mx-auto sm:mt-0 sm:w-auto sm:max-w-xl sm:flex-1" />

    <div class="ml-auto flex shrink-0 items-center gap-3 sm:ml-0">
      <div class="hidden items-center gap-2 xl:flex" aria-hidden="true">
        <span class="flex items-center gap-1 font-mono text-[10px] text-ink-500"><kbd>/</kbd> search</span>
        <span class="flex items-center gap-1 font-mono text-[10px] text-ink-500"><kbd>n</kbd> new</span>
      </div>
      <button type="button" (click)="health.ping()"
              class="flex h-8 items-center gap-2 rounded-full border border-ink-700 bg-ink-850/80 px-3 font-mono text-[11px] transition-colors hover:border-ink-500"
              [title]="health.state() === 'online' ? 'Storage: server/data/folio.json — click to re-ping' : 'Click to retry the local API'">
        @switch (health.state()) {
          @case ('online') {
            <span class="size-1.5 rounded-full bg-viridian-500 animate-pulse-dot"></span>
            <span class="text-viridian-400">Local API</span>
            <span class="hidden text-ink-400 sm:inline">· {{ health.health()?.docs }} docs</span>
          }
          @case ('offline') {
            <span class="size-1.5 rounded-full bg-vermil-500"></span>
            <span class="text-vermil-400">API offline</span>
          }
          @default {
            <span class="size-1.5 rounded-full bg-ink-500 animate-pulse-dot"></span>
            <span class="text-ink-400">checking…</span>
          }
        }
      </button>
    </div>
  </div>
</header>
